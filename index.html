<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alan Alvarenga · Desarrollador Full Stack</title>
    <meta
      name="description"
      content="Portafolio de Alan Alvarenga, desarrollador full stack y supervisor de sistemas en producción en Areguá, Paraguay."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Aplica el tema guardado antes del primer pintado (evita parpadeo) -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Copia estática del formulario de contacto para que Netlify Forms lo detecte en el build
      (la app es una SPA y el formulario real lo renderiza React). Mismo nombre y campos.
    -->
    <form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nombre" />
      <input type="email" name="email" />
      <select name="tipo">
        <option value="Proyecto o sistema">Proyecto o sistema</option>
        <option value="Oportunidad laboral">Oportunidad laboral</option>
        <option value="Colaboración social">Colaboración social</option>
        <option value="Otro">Otro</option>
      </select>
      <textarea name="mensaje"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
