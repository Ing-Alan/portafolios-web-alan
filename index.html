<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alan Alvarenga · Desarrollador Full Stack</title>
    <meta
      name="description"
      content="Portafolio de Alan Alvarenga, desarrollador full stack y supervisor de sistemas en producción en Areguá, Paraguay. Sistemas de gestión web seguros, de la base de datos al despliegue."
    />
    <meta name="author" content="Alan Alvarenga" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7FAFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071325" media="(prefers-color-scheme: dark)" />
    <!-- Dominio: si cambia, actualizarlo también en public/robots.txt, public/sitemap.xml y src/data/site.ts -->
    <link rel="canonical" href="https://alanalvarenga.dev/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PY" />
    <meta property="og:site_name" content="Alan Alvarenga" />
    <meta property="og:url" content="https://alanalvarenga.dev/" />
    <meta property="og:title" content="Alan Alvarenga · Desarrollador Full Stack" />
    <meta
      property="og:description"
      content="Sistemas de gestión web seguros, de la base de datos al despliegue. Mirá los proyectos en producción."
    />
    <meta property="og:image" content="https://alanalvarenga.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alan Alvarenga, desarrollador full stack, sobre un ñandutí en fondo azul oscuro" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alan Alvarenga · Desarrollador Full Stack" />
    <meta
      name="twitter:description"
      content="Sistemas de gestión web seguros, de la base de datos al despliegue. Mirá los proyectos en producción."
    />
    <meta name="twitter:image" content="https://alanalvarenga.dev/og-image.png" />

    <!-- Datos estructurados -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alan Alvarenga",
        "alternateName": "Alan Gustavo Alvarenga Ojeda",
        "jobTitle": "Desarrollador Full Stack · Supervisor de Sistemas en Producción",
        "url": "https://alanalvarenga.dev/",
        "image": "https://alanalvarenga.dev/og-image.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Areguá",
          "addressCountry": "PY"
        },
        "knowsAbout": ["React", "TypeScript", "PostgreSQL", "Supabase", "Seguridad de datos", "Sistemas de gestión"],
        "sameAs": ["https://www.linkedin.com/in/alan-alvarenga-ojeda", "https://github.com/Ing-Alan"]
      }
    </script>

    <!-- Aplica el tema guardado antes del primer pintado (evita parpadeo) -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Copia estática del formulario de contacto para que Netlify Forms lo detecte en el build
      (la app es una SPA y el formulario real lo renderiza React). Mismo nombre y campos.
    -->
    <form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nombre" />
      <input type="email" name="email" />
      <select name="tipo">
        <option value="Proyecto o sistema">Proyecto o sistema</option>
        <option value="Oportunidad laboral">Oportunidad laboral</option>
        <option value="Colaboración social">Colaboración social</option>
        <option value="Otro">Otro</option>
      </select>
      <textarea name="mensaje"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
